# Interfaz gráfica:  docker compose up --build        → abra http://localhost:6080/vnc.html
# Consola:           docker compose run --rm consola
# Pruebas:           docker compose run --rm antdron probar   (o cualquier comando del framework XP)
# config/ se monta desde su carpeta: edite las cédulas y pulse «Recargar configuración» en la aplicación.
services:
  antdron:
    build: .
    image: antdron:latest
    command: ["gui"]
    ports:
      - "6080:6080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 3 http://localhost:6080/vnc.html >/dev/null && xwininfo -root -tree | grep -Fq AntCiberDron"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 6
    volumes:
      - ./config:/opt/antdron/config
      - ./datos:/opt/antdron/datos
      - ./xp:/opt/antdron/xp
      - ./docs:/opt/antdron/docs:ro

  consola:
    image: antdron:latest
    command: ["consola"]
    stdin_open: true
    tty: true
    profiles: ["consola"]
    volumes:
      - ./config:/opt/antdron/config
      - ./datos:/opt/antdron/datos
